<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <pattern id="circuitPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L20 10 M0 20 L10 20 M30 20 L40 20 M20 30 L20 40" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
      <circle cx="20" cy="20" r="2" fill="#60a5fa" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Shield Background -->
  <path d="M512 64 L896 256 L896 640 C896 768 512 960 512 960 C512 960 128 768 128 640 L128 256 Z" 
        fill="url(#shieldGradient)" 
        stroke="url(#frameGradient)" 
        stroke-width="8"/>
  
  <!-- Circuit Board Pattern on Right Side -->
  <path d="M512 64 L896 256 L896 640 C896 768 512 960 512 960 C512 960 128 768 128 640 L128 256 Z" 
        fill="url(#circuitPattern)" 
        opacity="0.3" 
        clip-path="url(#rightHalf)"/>
  
  <!-- Metallic Frame with Light Streaks -->
  <path d="M512 64 L896 256 L896 640 C896 768 512 960 512 960 C512 960 128 768 128 640 L128 256 Z" 
        fill="none" 
        stroke="url(#frameGradient)" 
        stroke-width="12"/>
  
  <!-- Light Streaks -->
  <path d="M200 200 L300 300" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
  <path d="M824 200 L724 300" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
  <path d="M512 100 L512 200" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  
  <!-- Central Padlock -->
  <g transform="translate(512, 512)">
    <!-- Lock Body -->
    <rect x="-40" y="-20" width="80" height="60" rx="8" fill="url(#lockGradient)" stroke="#1e40af" stroke-width="2"/>
    <!-- Lock Shackle -->
    <path d="M-30 -20 Q-30 -40 -10 -40 L10 -40 Q30 -40 30 -20 L30 -10" 
          fill="none" 
          stroke="url(#lockGradient)" 
          stroke-width="6" 
          stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="8" fill="#1e40af"/>
    <rect x="-2" y="10" width="4" height="12" fill="#1e40af"/>
  </g>
  
  <!-- Glow Effect -->
  <path d="M512 64 L896 256 L896 640 C896 768 512 960 512 960 C512 960 128 768 128 640 L128 256 Z" 
        fill="none" 
        stroke="#3b82f6" 
        stroke-width="4" 
        opacity="0.3"/>
  
  <!-- Clipping Path for Right Half -->
  <defs>
    <clipPath id="rightHalf">
      <path d="M512 64 L896 256 L896 640 C896 768 512 960 512 960 C512 960 128 768 128 640 L128 256 Z"/>
      <rect x="512" y="64" width="512" height="896"/>
    </clipPath>
  </defs>
</svg>
